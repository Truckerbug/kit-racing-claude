<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
	<title>Racing</title>
	<style>
		body { margin: 0; overflow: hidden; background: #000; }
		canvas { display: block; touch-action: none; }
		.corner-link {
			position: absolute;
			color: #1f2430;
			font: 400 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
			text-decoration: none;
			background: rgba(255,255,255,0.92);
			padding: 9px 18px;
			border-radius: 999px;
			border: 1px solid rgba(0,0,0,0.06);
			box-shadow: 0 4px 14px rgba(0,0,0,0.18);
			backdrop-filter: blur(12px);
			-webkit-backdrop-filter: blur(12px);
			z-index: 20;
			transition: background 0.15s;
		}
		.corner-link:hover { background: #fff; }
		#editor-link { bottom: 12px; right: 12px; }
		#mode-link { top: 12px; right: 12px; }
	</style>
	<script type="importmap">
	{
		"imports": {
			"three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
			"three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/",
			"crashcat": "https://esm.sh/crashcat@0.0.3"
		}
	}
	</script>
</head>
<body>
	<a id="mode-link" class="corner-link" href="?mode=infinite">Infinite course</a>
	<a id="editor-link" class="corner-link" href="editor.html">Create new track</a>
	<script>
		const params = new URLSearchParams( location.search );
		const infiniteMode = params.get( 'mode' ) === 'infinite';
		const modeLink = document.getElementById( 'mode-link' );
		if ( infiniteMode ) {

			params.delete( 'mode' );
			modeLink.textContent = 'Classic course';

		} else {

			params.set( 'mode', 'infinite' );

		}
		const query = params.toString();
		modeLink.href = location.pathname + ( query ? '?' + query : '' );

		const map = params.get( 'map' );
		if ( map ) {
			const link = document.getElementById( 'editor-link' );
			link.href = 'editor.html?map=' + map;
			link.textContent = 'Edit this track';
		}
	</script>
	<script type="module" src="js/main.js"></script>
</body>
</html>
